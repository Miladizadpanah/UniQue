"adtag" = "برچسب تبلیغ"
"adtagDesc" = "معرفی یک کانال حامی با برچسبی از @MTProxybot. پیش از فعال‌سازی هشدار را بخوانید: مسیریابی Xray را برای همه حساب‌های این ورودی خاموش می‌کند."
"adtagPlaceholder" = "۳۲ کاراکتر هگز از @MTProxybot"
"adtagClientWarn" = "تنظیم برچسب برای همین یک حساب، کل ورودی را روی رله‌های میانی تلگرام می‌برد. هر حساب دیگری روی این ورودی هم مستقیم از همین سرور خارج می‌شود و قواعد مسیریابی Xray شما دیگر روی هیچ‌کدام اعمال نمی‌شود. برای بازگشت مسیریابی، برچسب همه حساب‌های اینجا را بردارید."
"adtagRoutingOffTitle" = "برچسب تبلیغ مسیریابی Xray را برای این ورودی خاموش می‌کند"
"adtagRoutingOffDesc" = "برچسب تبلیغ تنها زمانی شمرده می‌شود که ترافیک از رله‌های میانی تلگرام عبور کند و این مسیر ویژگی خود پروسه پروکسی است. تا وقتی برچسب تنظیم شده، همه حساب‌های این ورودی مستقیم از همین سرور خارج می‌شوند و قواعد مسیریابی خروجی شما روی هیچ‌کدام اعمال نمی‌شود. تلگرام کلید نشست پروکسی میانی را از آی‌پی و پورت خروجی همین سرور می‌سازد، بنابراین عبور دادن آن ترافیک از Xray پورت را عوض می‌کند و دست‌دهی را می‌شکند. برای مسیریابی این ورودی از طریق Xray برچسب تبلیغ را پاک کنید."

